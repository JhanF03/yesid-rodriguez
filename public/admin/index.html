<!doctype html>
<html lang="es"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex"><title>Panel de administración</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    body { padding: 1rem; } .wrap { max-width: 820px; margin: 0 auto; }
    .bar { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 1rem 0; display: flex; gap: 1rem; align-items: center; justify-content: space-between; flex-wrap: wrap; }
    details { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: .75rem; }
    summary { padding: 1rem 1.25rem; cursor: pointer; font-weight: 700; min-height: 48px; }
    details > div { padding: 0 1.25rem 1.25rem; display: grid; gap: 1rem; }
    .row { display: flex; align-items: center; gap: .6rem; } .row input[type=checkbox] { width: 22px; height: 22px; }
    .svc { border: 1px solid var(--line); border-radius: 10px; padding: 1rem; display: grid; gap: .75rem; }
    details input, details textarea, details select { background: #fff; }
    #login { max-width: 360px; margin: 20vh auto; }
  </style></head>
<body><div class="wrap" id="root"></div><script src="/admin/admin.js"></script></body></html>
